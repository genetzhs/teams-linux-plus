<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';">
  <title>Mail switcher</title>
  <link rel="stylesheet" href="switcher.css">
</head>
<body>
  <button id="toggle" class="toggle" type="button" title="Open Mail (Ctrl+Alt+M)" aria-label="Open Mail">
    <svg class="icon mail" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="5" width="18" height="14" rx="2.5" />
      <path d="m3.5 7.5 8.5 6 8.5-6" />
    </svg>
    <svg class="icon teams" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 11.5a7.5 7.5 0 0 1-10.9 6.7L4 19.5l1.3-4.7A7.5 7.5 0 1 1 20 11.5Z" />
      <path d="M9 10h6M9 13.5h4" />
    </svg>
    <span id="badge" class="badge" hidden></span>
  </button>
  <script src="switcher.js"></script>
</body>
</html>
