<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IncomingCallToast</title>

    <script>
        globalThis.incomingCallApi.onIncomingCallToastInit((data) => {
            document.getElementById('caller').innerText = data.caller || '';
            document.getElementById('text').innerText = data.text || '';
            document.getElementById('image').src = data.image || 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 fill=%27%23e8e9fa%27/%3E%3Ccircle cx=%2732%27 cy=%2725%27 r=%2711%27 fill=%27%235b5fc7%27/%3E%3Cpath d=%27M12 56c2-11 10-17 20-17s18 6 20 17%27 fill=%27%235b5fc7%27/%3E%3C/svg%3E';
        });
    </script>

    <link rel="stylesheet" href="../_shared/ui/theme.css">
    <style>
        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 14px 16px 16px;
            border: 1px solid var(--border);
            background:
                radial-gradient(120% 70% at 50% 0%, var(--accent-soft) 0%, transparent 70%),
                var(--surface);
            user-select: none;
            animation: ui-slide-in 260ms var(--ease);
        }

        header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
        }

        header img {
            border-radius: 4px;
        }

        header .live {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent);
        }

        header .live::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            animation: blink 1.2s ease-in-out infinite;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            min-height: 0;
        }

        .avatar {
            position: relative;
            margin-bottom: 8px;
        }

        .avatar img {
            display: block;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 0 3px var(--surface);
        }

        /* Two expanding rings: the "ringing" cue. */
        .avatar::before,
        .avatar::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid var(--accent);
            animation: ring 1.8s var(--ease) infinite;
        }

        .avatar::after {
            animation-delay: 0.9s;
        }

        #caller {
            max-width: 100%;
            overflow: hidden;
            font-size: 15px;
            font-weight: 650;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #text {
            max-width: 100%;
            overflow: hidden;
            color: var(--text-muted);
            font-size: 12.5px;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        footer {
            display: flex;
            justify-content: center;
            gap: 22px;
        }

        footer button {
            display: grid;
            place-items: center;
            width: 46px;
            height: 46px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 100ms var(--ease), filter 120ms var(--ease);
        }

        footer button:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        footer button:active {
            transform: scale(0.94);
        }

        footer .accept-video {
            background: var(--accent);
            color: var(--accent-text);
        }

        footer .accept-audio {
            background: var(--success);
        }

        footer .decline {
            background: var(--danger);
        }

        footer .decline svg {
            transform: rotate(135deg);
        }

        footer svg {
            width: 21px;
            height: 21px;
            fill: currentColor;
        }

        @keyframes ring {
            from {
                opacity: 0.7;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(1.55);
            }
        }

        @keyframes blink {
            50% {
                opacity: 0.3;
            }
        }
    </style>
</head>

<body>
    <header>
        <img src="../assets/icons/icon-16x16.png" alt="" width="16" height="16" /><span>Teams for Linux</span>
        <span class="live">Incoming call</span>
    </header>
    <main>
        <div class="avatar">
            <img id="image" src="" alt="">
        </div>
        <p id="caller"></p>
        <p id="text"></p>
    </main>
    <footer>
        <button class="button accept-video" title="Answer with video" aria-label="Answer with video">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6h9A2.5 2.5 0 0 1 16 8.5v7a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 2 15.5v-7A2.5 2.5 0 0 1 4.5 6Zm12.5 4.2 3.9-2.6A.7.7 0 0 1 22 8.2v7.6a.7.7 0 0 1-1.1.6L17 13.8Z"/></svg>
        </button>
        <button class="button accept-audio" title="Answer with audio" aria-label="Answer with audio">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 2.8 8.9 2.3a1.5 1.5 0 0 1 1.7.9l1.2 3a1.5 1.5 0 0 1-.4 1.7L9.7 9.3a11 11 0 0 0 5 5l1.4-1.7a1.5 1.5 0 0 1 1.7-.4l3 1.2a1.5 1.5 0 0 1 .9 1.7l-.5 2.3A2.5 2.5 0 0 1 18.8 21C10.6 20.7 3.3 13.4 3 5.2a2.5 2.5 0 0 1 3.6-2.4Z"/></svg>
        </button>
        <button class="button decline" title="Decline" aria-label="Decline">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 2.8 8.9 2.3a1.5 1.5 0 0 1 1.7.9l1.2 3a1.5 1.5 0 0 1-.4 1.7L9.7 9.3a11 11 0 0 0 5 5l1.4-1.7a1.5 1.5 0 0 1 1.7-.4l3 1.2a1.5 1.5 0 0 1 .9 1.7l-.5 2.3A2.5 2.5 0 0 1 18.8 21C10.6 20.7 3.3 13.4 3 5.2a2.5 2.5 0 0 1 3.6-2.4Z"/></svg>
        </button>
    </footer>
    <script>
        document.body.addEventListener('click', (event) => {
            const button = event.target.closest('button');
            if (button) {
                button.blur();
                let action;
                if (button.classList.contains('accept-video')) {
                    action = 'ACCEPT_VIDEO';
                }
                if (button.classList.contains('accept-audio')) {
                    action = 'ACCEPT_AUDIO';
                }
                if (button.classList.contains('decline')) {
                    action = 'DECLINE';
                }
                if (action) {
                    globalThis.incomingCallApi.sendIncomingCallAction(action);
                }
            }
        });
    </script>
</body>

</html>
