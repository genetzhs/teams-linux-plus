<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Security Key PIN</title>
    <link rel="stylesheet" href="../_shared/ui/theme.css" />
    <link rel="stylesheet" href="../_shared/ui/prompt.css" />
  </head>
  <body>
    <h3>Security Key PIN</h3>
    <p>Enter the PIN for your FIDO2 security key to continue signing in.</p>
    <form id="pin-form">
      <input type="password" id="pin" aria-label="Security key PIN" placeholder="PIN" autofocus autocomplete="off" />
      <div class="buttons">
        <button type="button" class="secondary" id="cancel-btn">Cancel</button>
        <button type="submit" class="primary">OK</button>
      </div>
    </form>
    <script>
      document.getElementById("pin-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const pin = document.getElementById("pin").value;
        if (pin) globalThis.api.submitPin(pin);
      });
      document.getElementById("cancel-btn").addEventListener("click", () => {
        globalThis.api.cancelPin();
      });
    </script>
  </body>
</html>
