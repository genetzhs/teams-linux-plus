<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';">
    <title>Join Meeting</title>
    <link rel="stylesheet" href="../_shared/ui/theme.css">
    <link rel="stylesheet" href="joinMeeting.css">
</head>
<body>
    <div class="ui-dialog">
        <header class="ui-header">
            <div class="ui-hero" aria-hidden="true">
                <svg class="icon" viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="m15.5 10.5 6-3.5v10l-6-3.5"/></svg>
            </div>
            <div>
                <h2 class="ui-title">Join a meeting</h2>
                <p class="ui-lead">Paste the meeting link from your invite or calendar.</p>
            </div>
        </header>
        <div>
            <input type="text" id="url-input" class="field" aria-label="Teams meeting URL" aria-describedby="error-message" placeholder="https://teams.cloud.microsoft/l/meetup-join/..." spellcheck="false" autofocus>
            <div class="ui-hint error" id="error-message" aria-live="polite"></div>
        </div>
        <div class="ui-actions">
            <button id="cancel-btn" class="btn">Cancel</button>
            <button id="join-btn" class="btn primary">Join</button>
        </div>
    </div>
    <script src="joinMeeting.js"></script>
</body>
</html>
