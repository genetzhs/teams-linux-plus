<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8A8CF8"/>
      <stop offset="0.55" stop-color="#5B5FC7"/>
      <stop offset="1" stop-color="#3D2FA8"/>
    </linearGradient>
    <linearGradient id="glyph" gradientUnits="userSpaceOnUse" x1="0" y1="362" x2="0" y2="610">
      <stop offset="0" stop-color="#6E70E0"/>
      <stop offset="1" stop-color="#4536B4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1B1060" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle tile -->
  <rect x="40" y="40" width="944" height="944" rx="236" fill="url(#bg)"/>
  <rect x="40" y="40" width="944" height="944" rx="236" fill="url(#glow)"/>
  <rect x="41.5" y="41.5" width="941" height="941" rx="234.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Speech bubble: rounded body plus a tail at the bottom left -->
  <g filter="url(#lift)" fill="#FFFFFF">
    <rect x="224" y="232" width="576" height="484" rx="168"/>
    <path d="M 312 620 L 286 782 C 282 808 306 820 326 806 L 476 700 Z"/>
  </g>

  <!-- T, one shape so the gradient has no seam at the join -->
  <path fill="url(#glyph)" d="M 400 362 H 624 A 38 38 0 0 1 624 438 H 550 V 572 A 38 38 0 0 1 474 572 V 438 H 400 A 38 38 0 0 1 400 362 Z"/>
</svg>
