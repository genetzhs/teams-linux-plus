<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Navigation</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="rail.css" />
  </head>
  <body>
    <nav class="rail" aria-label="Apps">
      <img class="logo" src="icon.png" alt="" width="30" height="30" />

      <div class="apps" role="tablist" aria-orientation="vertical">
        <button class="app" role="tab" data-view="teams" aria-selected="true" title="Teams (Ctrl+Alt+1)">
          <span class="glyph">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11.5a7.5 7.5 0 0 1-10.9 6.7L4 19.5l1.3-4.7A7.5 7.5 0 1 1 20 11.5Z" />
              <path d="M9 10h6M9 13.5h4" />
            </svg>
            <span class="badge" data-badge="teams" hidden></span>
          </span>
          <span class="label">Teams</span>
        </button>

        <button class="app" role="tab" data-view="mail" aria-selected="false" title="Mail (Ctrl+Alt+2)">
          <span class="glyph">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2.5" />
              <path d="m3.5 7.5 8.5 6 8.5-6" />
            </svg>
            <span class="badge dot" data-badge="mail" hidden></span>
          </span>
          <span class="label">Mail</span>
        </button>
      </div>

      <div class="spacer"></div>

      <button class="tool" data-open="join" title="Join a meeting (Ctrl+Shift+J)" aria-label="Join a meeting">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.5" y="6" width="13" height="12" rx="2.5" />
          <path d="m15.5 10.5 6-3.5v10l-6-3.5" />
        </svg>
      </button>
      <button class="tool" data-open="settings" title="Settings (Ctrl+,)" aria-label="Settings">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1" />
          <circle cx="15" cy="7" r="2" />
          <circle cx="9" cy="12" r="2" />
          <circle cx="17" cy="17" r="2" />
        </svg>
      </button>
    </nav>
    <script src="common.js"></script>
    <script src="rail.js"></script>
  </body>
</html>
