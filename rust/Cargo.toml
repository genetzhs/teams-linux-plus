[package]
name = "teams-for-linux-rs"
version = "0.1.0"
description = "Lightweight native Microsoft Teams client for Linux (Tauri/WebKitGTK)"
authors = ["Teams for Linux contributors"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2", features = ["v2_40"] }

[profile.release]
# Small, fast binary: the app is mostly glue around the system WebView.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
